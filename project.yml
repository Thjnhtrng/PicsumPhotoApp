name: PicsumPhotoApp
options:
  bundleIdPrefix: com.candidate
  deploymentTarget:
    iOS: "12.0"
targets:
  PicsumPhotoApp:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - App
      - Domain
      - Data
      - Presentation
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.candidate.PicsumPhotoApp
        SWIFT_VERSION: "5.0"

  PicsumPhotoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PicsumPhotoApp